name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Path build -Recurse -Directory -Filter *.vst3 | ForEach-Object { Copy-Item -Recurse $_.FullName dist/ }
          Get-ChildItem -Path build -Recurse -File -Filter "Kuzko EQ.exe" | ForEach-Object { Copy-Item $_.FullName dist/ }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: Kuzko-Windows
          path: dist
